[project]
name = "omar-workspace"
version = "0.1.0"
description = "Omar, the AI Calling Agent: uv workspace root"
requires-python = ">=3.12"
dependencies = ["omar-core", "omar-voice"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "voice"]

[tool.uv.sources]
omar-core = { workspace = true }
omar-voice = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "voice/tests", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real providers (needs API keys)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["omar_core", "omar_voice", "harness", "fake_llm"]
