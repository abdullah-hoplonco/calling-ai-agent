[project]
name = "omar-voice"
version = "0.1.0"
description = "Omar's LiveKit agent worker"
requires-python = ">=3.12"
dependencies = [
  "omar-core",
  "livekit-agents[deepgram,openai,cartesia,elevenlabs,silero,turn-detector]>=1.2",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[project.scripts]
omar-agent = "omar_voice.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omar_voice"]
